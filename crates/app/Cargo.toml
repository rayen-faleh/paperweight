[package]
name = "paperweight-app"
description = "Paperweight desktop app: tray, reminders, calendar feed and GUI."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "paperweight"

[[bin]]
name = "paperweight"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
paperweight-core.workspace = true
tauri = { version = "2.12.6", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-notification = "2.8.1"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-updater = "2.14.1"
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
