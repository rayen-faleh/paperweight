name: Release

# Push a tag like v0.2.0 (matching the version in Cargo.toml and
# crates/app/tauri.conf.json) to publish a release. Installed copies of
# Paperweight find it through "Check for updates".
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY           contents of ~/.tauri/paperweight.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  contents of ~/.tauri/paperweight.key.password

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-24.04
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches the app version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          app=$(python3 -c "import json;print(json.load(open('crates/app/tauri.conf.json'))['version'])")
          cargo=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          echo "tag=$tag app=$app cargo=$cargo"
          [ "$tag" = "$app" ] && [ "$tag" = "$cargo" ] || { echo "::error::Tag $GITHUB_REF_NAME does not match version $app / $cargo"; exit 1; }

      - name: Create the release
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "Paperweight ${GITHUB_REF_NAME}" \
            --notes "Install the file for your system below. Already have Paperweight? Open Settings → Updates → Check for updates." \
            --draft=false
          echo "id=$(gh api repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME --jq .id)" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Linux system libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libdbus-1-dev libssl-dev build-essential file

      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            crates/app/package-lock.json
            packaging/mcpb/package-lock.json

      - name: Frontend dependencies
        working-directory: crates/app
        run: npm ci

      - name: Sidecar
        run: ./scripts/prepare-sidecar.sh

      # Builds the installers plus signed update files, uploads them to the
      # release, and merges this platform into the release's latest.json.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/app
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          args: --config tauri.bundle.conf.json --config tauri.release.conf.json
          retryAttempts: 2

      - name: MCP Bundle (.mcpb)
        working-directory: packaging/mcpb
        run: |
          npm ci
          npm run build

      - name: Attach the .mcpb
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist-mcpb/*.mcpb --repo "$GITHUB_REPOSITORY" --clobber
