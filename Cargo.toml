[workspace]
resolver = "3"
members = ["crates/core", "crates/mcp", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"
repository = "https://github.com/paperweight-app/paperweight"

[workspace.dependencies]
paperweight-core = { path = "crates/core" }
rusqlite = { version = "0.43", features = ["bundled"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10.4"
iana-time-zone = "0.1.65"
directories = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
schemars = { version = "1.2.3", features = ["chrono04"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "process", "time"] }
rmcp = { version = "3.10.0", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
anyhow = "1.0.104"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
